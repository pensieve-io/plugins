name: Plugin checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Python 3.9 builds stop at Ubuntu 24.04, and macOS still ships 3.9 as its
    # system Python, so the oldest supported runtime keeps a pinned runner.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7' ruff
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .
